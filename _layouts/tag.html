{% assign filtered_posts = site.posts | where: 'tag', page.name %}
<p class="crumb"><a href="{{ "/tag.html" | relative_url }}">Tags</a> / {{ page.name }}</p>
<h1>{{ page.name }} <span class="badge b-tag">{{ filtered_posts.size }} {% if filtered_posts.size == 1 %}post{% else %}posts{% endif %}</span></h1>

{% include post_table.html posts=filtered_posts excerpt=true %}
