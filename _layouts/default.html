<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% elsif page.name %}{{ page.name }} · {% endif %}Notes</title>
    <link rel="stylesheet" href="{{ "/assets/css/styles.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/syntax.css" | relative_url }}">
    <link rel="icon" href="{{ "/assets/images/favicon.svg" | relative_url }}" type="image/svg+xml">
    <script>
      MathJax = {
        tex: {
          tags: 'ams',    // Enable AMS-style numbering
          inlineMath: [['$', '$'], ['\\(', '\\)']]
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    {% include navigation.html %}

    <main>
      {{ content }}
    </main>
    <script>
      document.querySelectorAll('div.highlight').forEach(function (block) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(block.querySelector('code').innerText).then(function () {
            btn.textContent = 'Copied!';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
          });
        });
        block.appendChild(btn);
      });
    </script>
  </body>
</html>
